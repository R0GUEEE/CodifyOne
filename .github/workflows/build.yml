name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned CodifyOne IPA
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Submodules are vendored as xcframeworks under Resources/; cloning the
          # wasmer/proton/hetGPU sources recursively added ~10 minutes per run.
          fetch-depth: 1

      - name: Select Xcode
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

          xcodebuild -version
          xcodebuild -showsdks

      - name: Build editor bundle (extension host) from fork
        shell: bash
        run: |
          set -euxo pipefail

          # The editor web app is what carries the VS Code extension host and the
          # `vscode` API implementation, so it is built from our fork instead of
          # the upstream prebuilt release.
          git clone --depth 1 https://github.com/R0GUEEE/codeapp-monaco.git _editor
          cd _editor
          npm ci
          npm run build
          cd ..
          mkdir -p Resources
          rm -rf Resources/monaco-textmate.bundle
          cp -R _editor/monaco-textmate.bundle Resources/
          test -f Resources/monaco-textmate.bundle/index.html
          test -n "$(find Resources/monaco-textmate.bundle/assets -name 'index-*.js' | head -1)"

      - name: Cache downloaded frameworks
        uses: actions/cache@v4
        with:
          path: |
            Resources/llvm
            Resources/Term
            Resources/PythonAux
            Resources/NodeJS/NodeMobile.xcframework
            Resources/NMSSH.xcframework
            Resources/PHP
            Resources/Java
            Resources/cpython
          key: frameworks-${{ runner.os }}-v1-2025.9.20

      - name: Download frameworks
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Install WASM toolchain
        shell: bash
        run: |
          set -euxo pipefail
          # Xcode's clang has no wasm32 backend, and the "Generate WASM Probe
          # Resources" phase needs one, so install LLVM from Homebrew.
          brew install llvm lld || brew upgrade llvm lld || true
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          /opt/homebrew/opt/llvm/bin/clang --version
          /opt/homebrew/opt/lld/bin/wasm-ld --version

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project Code.xcodeproj \
            -scheme CodifyOne

      - name: Build unsigned iOS app
        shell: bash
        env:
          # Force the Homebrew LLVM toolchain for the wasm probe build phase.
          CLANG: /opt/homebrew/opt/llvm/bin/clang
          WASM_LD: /opt/homebrew/opt/lld/bin/wasm-ld
        run: |
          set -euxo pipefail

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project Code.xcodeproj \
            -scheme CodifyOne \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail

          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n 1)"

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No .app bundle was produced."
            find "$PWD/build/DerivedData/Build/Products" -maxdepth 3 -print || true
            exit 1
          fi

          echo "Packaging: $APP_PATH"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Ensure the resulting package contains no app signature.
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} + || true
          find Payload -type f -name embedded.mobileprovision -delete || true

          /usr/bin/zip -qry CodifyOne-unsigned.ipa Payload

          echo "Created unsigned IPA:"
          ls -lh CodifyOne-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodifyOne-unsigned-ipa
          path: CodifyOne-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
